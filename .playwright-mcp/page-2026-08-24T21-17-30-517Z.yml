        - generic [ref=f50e465]:
          - button "Le devis est-il vraiment gratuit ?" [ref=f50e466]
          - paragraph [ref=f50e471]: Oui, totalement. Nous nous déplaçons chez vous pour une visite technique, prenons les mesures et vous remettons un devis détaillé sous 48h — sans aucun engagement de votre part.
        - generic [ref=f50e472]:
          - button "Quels sont vos délais d'intervention ?" [ref=f50e473]
          - paragraph [ref=f50e478]: Selon la prestation et la saison, comptez en général 4 à 8 semaines entre la signature du devis et la pose. Pour un dépannage (volet bloqué, serrure), nous intervenons 7j/7, souvent le jour même.
        - generic [ref=f50e479]:
          - button "Quelles garanties proposez-vous ?" [ref=f50e480]
          - paragraph [ref=f50e485]: Tous nos chantiers sont couverts par la garantie décennale. Les menuiseries bénéficient en plus des garanties fabricant, jusqu'à 10 ans selon les produits.
        - generic [ref=f50e486]:
          - button "Puis-je bénéficier d'aides pour mes travaux ?" [ref=f50e487]
          - paragraph [ref=f50e492]: "Oui. Nous sommes certifiés RGE Qualibat : vos travaux d'isolation et de menuiseries peuvent ouvrir droit à MaPrimeRénov', aux CEE et à la TVA réduite. Nous vous accompagnons dans les démarches."
        - generic [ref=f50e493]:
          - button "Travaillez-vous avec des marques reconnues ?" [ref=f50e494]
          - paragraph [ref=f50e499]: Nous sommes partenaires K·LINE pour les menuiseries alu, et posons notamment du VELUX et du SOMFY pour la motorisation. Des produits éprouvés, fabriqués en France pour la plupart.
        - generic [ref=f50e500]:
          - button "Peut-on voir les produits avant d'acheter ?" [ref=f50e501]
          - paragraph [ref=f50e506]: Bien sûr — notre showroom de 300 m² à Bailleul présente fenêtres, volets, portes, portails et motorisations en situation réelle. Venez toucher les matériaux et comparer, avec un conseiller.
