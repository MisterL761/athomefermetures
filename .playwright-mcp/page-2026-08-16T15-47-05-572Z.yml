        - heading "Les questions qu'on nous pose souvent." [level=2] [ref=e462]
      - generic [ref=e463]:
        - generic [ref=e464]:
          - button "Le devis est-il vraiment gratuit ?" [ref=e465]
          - paragraph [ref=e470]: Oui, totalement. Nous nous déplaçons chez vous pour une visite technique, prenons les mesures et vous remettons un devis détaillé sous 48h — sans aucun engagement de votre part.
        - generic [ref=e471]:
          - button "Quels sont vos délais d'intervention ?" [ref=e472]
          - paragraph [ref=e477]: Selon la prestation et la saison, comptez en général 4 à 8 semaines entre la signature du devis et la pose. Pour un dépannage (volet bloqué, serrure), nous intervenons 7j/7, souvent le jour même.
        - generic [ref=e478]:
          - button "Quelles garanties proposez-vous ?" [ref=e479]
          - paragraph [ref=e484]: Tous nos chantiers sont couverts par la garantie décennale. Les menuiseries bénéficient en plus des garanties fabricant, jusqu'à 10 ans selon les produits.
        - generic [ref=e485]:
          - button "Puis-je bénéficier d'aides pour mes travaux ?" [ref=e486]
          - paragraph [ref=e491]: "Oui. Nous sommes certifiés RGE Qualibat : vos travaux d'isolation et de menuiseries peuvent ouvrir droit à MaPrimeRénov', aux CEE et à la TVA réduite. Nous vous accompagnons dans les démarches."
        - generic [ref=e492]:
          - button "Travaillez-vous avec des marques reconnues ?" [ref=e493]
          - paragraph [ref=e498]: Nous sommes partenaires K·LINE pour les menuiseries alu, et posons notamment du VELUX et du SOMFY pour la motorisation. Des produits éprouvés, fabriqués en France pour la plupart.
        - generic [ref=e499]:
          - button "Peut-on voir les produits avant d'acheter ?" [ref=e500]
          - paragraph [ref=e505]: Bien sûr — notre showroom de 300 m² à Bailleul présente fenêtres, volets, portes, portails et motorisations en situation réelle. Venez toucher les matériaux et comparer, avec un conseiller.
