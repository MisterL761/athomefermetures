          - button "Le devis est-il vraiment gratuit ?" [ref=f16e465]
          - paragraph [ref=f16e470]: Oui, totalement. Nous nous déplaçons chez vous pour une visite technique, prenons les mesures et vous remettons un devis détaillé sous 48h — sans aucun engagement de votre part.
        - generic [ref=f16e471]:
          - button "Quels sont vos délais d'intervention ?" [ref=f16e472]
          - paragraph [ref=f16e477]: Selon la prestation et la saison, comptez en général 4 à 8 semaines entre la signature du devis et la pose. Pour un dépannage (volet bloqué, serrure), nous intervenons 7j/7, souvent le jour même.
        - generic [ref=f16e478]:
          - button "Quelles garanties proposez-vous ?" [ref=f16e479]
          - paragraph [ref=f16e484]: Tous nos chantiers sont couverts par la garantie décennale. Les menuiseries bénéficient en plus des garanties fabricant, jusqu'à 10 ans selon les produits.
        - generic [ref=f16e485]:
          - button "Puis-je bénéficier d'aides pour mes travaux ?" [ref=f16e486]
          - paragraph [ref=f16e491]: "Oui. Nous sommes certifiés RGE Qualibat : vos travaux d'isolation et de menuiseries peuvent ouvrir droit à MaPrimeRénov', aux CEE et à la TVA réduite. Nous vous accompagnons dans les démarches."
        - generic [ref=f16e492]:
          - button "Travaillez-vous avec des marques reconnues ?" [ref=f16e493]
          - paragraph [ref=f16e498]: Nous sommes partenaires K·LINE pour les menuiseries alu, et posons notamment du VELUX et du SOMFY pour la motorisation. Des produits éprouvés, fabriqués en France pour la plupart.
        - generic [ref=f16e499]:
          - button "Peut-on voir les produits avant d'acheter ?" [ref=f16e500]
          - paragraph [ref=f16e505]: Bien sûr — notre showroom de 300 m² à Bailleul présente fenêtres, volets, portes, portails et motorisations en situation réelle. Venez toucher les matériaux et comparer, avec un conseiller.
