      - generic [ref=e465]:
        - generic [ref=e466]:
          - button "Le devis est-il vraiment gratuit ?" [ref=e467]
          - paragraph [ref=e472]: Oui, totalement. Nous nous déplaçons chez vous pour une visite technique, prenons les mesures et vous remettons un devis détaillé sous 48h — sans aucun engagement de votre part.
        - generic [ref=e473]:
          - button "Quels sont vos délais d'intervention ?" [ref=e474]
          - paragraph [ref=e479]: Selon la prestation et la saison, comptez en général 4 à 8 semaines entre la signature du devis et la pose. Pour un dépannage (volet bloqué, serrure), nous intervenons 7j/7, souvent le jour même.
        - generic [ref=e480]:
          - button "Quelles garanties proposez-vous ?" [ref=e481]
          - paragraph [ref=e486]: Tous nos chantiers sont couverts par la garantie décennale. Les menuiseries bénéficient en plus des garanties fabricant, jusqu'à 10 ans selon les produits.
        - generic [ref=e487]:
          - button "Puis-je bénéficier d'aides pour mes travaux ?" [ref=e488]
          - paragraph [ref=e493]: "Oui. Nous sommes certifiés RGE Qualibat : vos travaux d'isolation et de menuiseries peuvent ouvrir droit à MaPrimeRénov', aux CEE et à la TVA réduite. Nous vous accompagnons dans les démarches."
        - generic [ref=e494]:
          - button "Travaillez-vous avec des marques reconnues ?" [ref=e495]
          - paragraph [ref=e500]: Nous sommes partenaires K·LINE pour les menuiseries alu, et posons notamment du VELUX et du SOMFY pour la motorisation. Des produits éprouvés, fabriqués en France pour la plupart.
        - generic [ref=e501]:
          - button "Peut-on voir les produits avant d'acheter ?" [ref=e502]
          - paragraph [ref=e507]: Bien sûr — notre showroom de 300 m² à Bailleul présente fenêtres, volets, portes, portails et motorisations en situation réelle. Venez toucher les matériaux et comparer, avec un conseiller.
