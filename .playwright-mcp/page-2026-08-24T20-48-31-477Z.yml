      - generic [ref=f46e132]:
        - generic [ref=f46e133]:
          - button "L'isolation extérieure est-elle vraiment plus efficace que l'isolation intérieure ?" [ref=f46e134]
          - paragraph [ref=f46e139]: Elle traite mieux les ponts thermiques (jonctions murs/planchers/refends) car l'isolant enveloppe l'ensemble du bâti, ce que l'isolation intérieure ne peut pas faire aussi complètement.
        - generic [ref=f46e140]:
          - button "Quelles aides pour financer une isolation extérieure ?" [ref=f46e141]
          - paragraph [ref=f46e146]: Selon vos revenus et votre logement, ces travaux peuvent ouvrir droit à MaPrimeRénov', aux Certificats d'Économie d'Énergie (CEE) et à la TVA réduite à 5,5%. Nous vous accompagnons dans les démarches.
        - generic [ref=f46e147]:
          - button "L'isolation extérieure convient-elle à toutes les façades ?" [ref=f46e148]
          - paragraph [ref=f46e153]: La majorité des façades en briques, parpaings ou béton se prêtent à l'ITE. Certaines maisons de caractère ou en zone protégée peuvent nécessiter une étude spécifique, que nous réalisons lors de la visite technique.
        - generic [ref=f46e154]:
          - button "Combien de temps dure un chantier d'isolation extérieure ?" [ref=f46e155]
          - paragraph [ref=f46e160]: Pour une maison individuelle, comptez en général 2 à 4 semaines de travaux selon la surface de façade et la finition choisie (enduit ou bardage).
        - generic [ref=f46e161]:
          - button "L'isolation extérieure réduit-elle vraiment la facture de chauffage ?" [ref=f46e162]
          - paragraph [ref=f46e167]: "Oui : en supprimant les ponts thermiques au niveau des murs, principale source de déperdition, l'ITE permet généralement de réduire la facture de chauffage jusqu'à 30%."
