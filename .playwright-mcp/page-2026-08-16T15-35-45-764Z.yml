      - generic [ref=f1e393]:
        - generic [ref=f1e394]: FAQ
        - heading "Les questions qu'on nous pose souvent." [level=2] [ref=f1e395]
      - generic [ref=f1e396]:
        - generic [ref=f1e397]:
          - button "Le devis est-il vraiment gratuit ?" [ref=f1e398]
          - paragraph [ref=f1e403]: Oui, totalement. Nous nous déplaçons chez vous pour une visite technique, prenons les mesures et vous remettons un devis détaillé sous 48h — sans aucun engagement de votre part.
        - generic [ref=f1e404]:
          - button "Quels sont vos délais d'intervention ?" [ref=f1e405]
          - paragraph [ref=f1e410]: Selon la prestation et la saison, comptez en général 4 à 8 semaines entre la signature du devis et la pose. Pour un dépannage (volet bloqué, serrure), nous intervenons 7j/7, souvent le jour même.
        - generic [ref=f1e411]:
          - button "Quelles garanties proposez-vous ?" [ref=f1e412]
          - paragraph [ref=f1e417]: Tous nos chantiers sont couverts par la garantie décennale. Les menuiseries bénéficient en plus des garanties fabricant, jusqu'à 10 ans selon les produits.
        - generic [ref=f1e418]:
          - button "Puis-je bénéficier d'aides pour mes travaux ?" [ref=f1e419]
          - paragraph [ref=f1e424]: "Oui. Nous sommes certifiés RGE Qualibat : vos travaux d'isolation et de menuiseries peuvent ouvrir droit à MaPrimeRénov', aux CEE et à la TVA réduite. Nous vous accompagnons dans les démarches."
        - generic [ref=f1e425]:
          - button "Travaillez-vous avec des marques reconnues ?" [ref=f1e426]
          - paragraph [ref=f1e431]: Nous sommes partenaires K·LINE pour les menuiseries alu, et posons notamment du VELUX et du SOMFY pour la motorisation. Des produits éprouvés, fabriqués en France pour la plupart.
        - generic [ref=f1e432]:
          - button "Peut-on voir les produits avant d'acheter ?" [ref=f1e433]
          - paragraph [ref=f1e438]: Bien sûr — notre showroom de 300 m² à Bailleul présente fenêtres, volets, portes, portails et motorisations en situation réelle. Venez toucher les matériaux et comparer, avec un conseiller.
