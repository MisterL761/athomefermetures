      - generic [ref=f32e364]:
        - generic [ref=f32e365]: FAQ
        - heading "Les questions qu'on nous pose souvent." [level=2] [ref=f32e366]
      - generic [ref=f32e367]:
        - generic [ref=f32e368]:
          - button "Le devis est-il vraiment gratuit ?" [ref=f32e369]
          - paragraph [ref=f32e374]: Oui, totalement. Nous nous déplaçons chez vous pour une visite technique, prenons les mesures et vous remettons un devis détaillé sous 48h — sans aucun engagement de votre part.
        - generic [ref=f32e375]:
          - button "Quels sont vos délais d'intervention ?" [ref=f32e376]
          - paragraph [ref=f32e381]: Selon la prestation et la saison, comptez en général 4 à 8 semaines entre la signature du devis et la pose. Pour un dépannage (volet bloqué, serrure), nous intervenons 7j/7, souvent le jour même.
        - generic [ref=f32e382]:
          - button "Quelles garanties proposez-vous ?" [ref=f32e383]
          - paragraph [ref=f32e388]: Tous nos chantiers sont couverts par la garantie décennale. Les menuiseries bénéficient en plus des garanties fabricant, jusqu'à 10 ans selon les produits.
        - generic [ref=f32e389]:
          - button "Puis-je bénéficier d'aides pour mes travaux ?" [ref=f32e390]
          - paragraph [ref=f32e395]: "Oui. Nous sommes certifiés RGE Qualibat : vos travaux d'isolation et de menuiseries peuvent ouvrir droit à MaPrimeRénov', aux CEE et à la TVA réduite. Nous vous accompagnons dans les démarches."
        - generic [ref=f32e396]:
          - button "Travaillez-vous avec des marques reconnues ?" [ref=f32e397]
          - paragraph [ref=f32e402]: Nous sommes partenaires K·LINE pour les menuiseries alu, et posons notamment du VELUX et du SOMFY pour la motorisation. Des produits éprouvés, fabriqués en France pour la plupart.
        - generic [ref=f32e403]:
          - button "Peut-on voir les produits avant d'acheter ?" [ref=f32e404]
          - paragraph [ref=f32e409]: Bien sûr — notre showroom de 300 m² à Bailleul présente fenêtres, volets, portes, portails et motorisations en situation réelle. Venez toucher les matériaux et comparer, avec un conseiller.
